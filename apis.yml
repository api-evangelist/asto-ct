aid: asto-ct
name: Asto CT
description: 'Asto CT, Inc. is a Middleton, Wisconsin medical-imaging device manufacturer
  that designs and builds Equina, a robotically positioned, weight-bearing fan-beam
  computed tomography (CT) scanner purpose-built for imaging mildly sedated, standing
  horses. Founded on a 2016 concept and first installed at UW-Madison in 2019, the
  company sells capital imaging equipment plus installation, training and ongoing
  clinical support to equine hospitals and veterinary teaching hospitals worldwide,
  with offices in Middleton, Wisconsin and Crawley, United Kingdom. Asto CT is a
  hardware company: the Equina system is operated from an on-site console and the
  company publishes no public developer program, API, SDK or machine-readable
  interface contract.'
